<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Security Checklist - MojKripto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h1 {
            color: #1a252f;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .progress-container {
            background: #e2e8f0;
            border-radius: 10px;
            height: 20px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            background: #27ae60;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .checklist {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .item:last-child {
            border-bottom: none;
        }
        .item input {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .item label {
            font-size: 16px;
            cursor: pointer;
        }
        .completed {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Crypto Security Checklist</h1>
    <p class="subtitle">Osnovna provjera sigurnosti za svakog kripto korisnika</p>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Napredak: 0%</div>

    <div class="checklist">
        <div class="item">
            <input type="checkbox" id="step1" onchange="updateProgress()">
            <label for="step1" id="label1">Hardware novčanik je kupljen isključivo od službenog proizvođača.</label>
        </div>
        <div class="item">
            <input type="checkbox" id="step2" onchange="updateProgress()">
            <label for="label2" id="label2">Seed fraza (24 riječi) zapisana je na papir/metal, nikada u digitalnom obliku.</label>
        </div>
        <div class="item">
            <input type="checkbox" id="step3" onchange="updateProgress()">
            <label for="label3" id="label3">Uključena je 2FA autentifikacija (Google Authenticator/YubiKey) na svim mjenjačnicama.</label>
        </div>
        <div class="item">
            <input type="checkbox" id="step4" onchange="updateProgress()">
            <label for="label4" id="label4">SMS 2FA je isključen gdje god je to moguće (zaštita od SIM swap napada).</label>
        </div>
        <div class="item">
            <input type="checkbox" id="step5" onchange="updateProgress()">
            <label for="label5" id="label5">Korištenje odvojenog i sigurnog e-maila samo za kripto račune.</label>
        </div>
    </div>

    <script>
        const totalSteps = 5;

        function updateProgress() {
            let checkedCount = 0;
            for (let i = 1; i <= totalSteps; i++) {
                const checkbox = document.getElementById('step' + i);
                const label = document.getElementById('label' + i);
                
                if (checkbox.checked) {
                    checkedCount++;
                    label.classList.add('completed');
                    localStorage.setItem('step' + i, 'true');
                } else {
                    label.classList.remove('completed');
                    localStorage.setItem('step' + i, 'false');
                }
            }

            const percentage = Math.round((checkedCount / totalSteps) * 100);
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').innerText = 'Napredak: ' + percentage + '% (' + checkedCount + '/' + totalSteps + ')';
        }

        // Učitavanje spremljenog stanja pri otvaranju stranice
        window.onload = function() {
            for (let i = 1; i <= totalSteps; i++) {
                const savedState = localStorage.getItem('step' + i);
                if (savedState === 'true') {
                    document.getElementById('step' + i).checked = true;
                }
            }
            updateProgress();
        }
    </script>

</body>
</html>
